[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ontojev"
version = "0.1.0"
description = "Cancer-general autonomous computational research laboratory"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.11,<3"]

[project.optional-dependencies]
dev = ["mypy>=1.15,<3", "pytest>=8.4,<9", "pytest-timeout>=2.4,<3", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/ontojev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

